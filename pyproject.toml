[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "galet-prompt-builder"
version = "0.1.0.dev0"
description = "Provider-neutral, memory-aware prompt compilation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "galet @ git+https://github.com/junwin/galet.git@cd73d43729f9ba7b88096902efd677181283d12d",
    "galet-memory @ git+https://github.com/junwin/galet-memory.git@74f82530e31f26e6ce20628288ac6fc6a5ab0205",
]

[project.optional-dependencies]
test = ["pytest>=8"]
semantic = ["sqlite-vec>=0.1.9"]

[project.scripts]
galet-prompt-run = "galet_prompt_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
