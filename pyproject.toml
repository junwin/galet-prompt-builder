[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galet-prompt-builder"
version = "0.1.1"
description = "Provider-neutral, memory-aware prompt compilation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "junwin", email = "jdunwin@gmail.com" }]
keywords = ["prompt", "llm", "memory", "prompt-builder"]
dependencies = [
    "galet>=0.1.2",
    "galet-memory>=0.1.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = ["pytest>=8"]
semantic = ["sqlite-vec>=0.1.9"]

[project.scripts]
galet-prompt-run = "galet_prompt_builder.cli:main"

[project.urls]
Homepage = "https://github.com/junwin/galet-prompt-builder"
Repository = "https://github.com/junwin/galet-prompt-builder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
